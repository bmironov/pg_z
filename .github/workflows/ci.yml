name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          tags: pg_z:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Shared Database Volume
        run: |
          # Create a shared directory on the host with correct permissions
          mkdir -p ${{ github.workspace }}/pgdata
          chmod 777 ${{ github.workspace }}/pgdata

      - name: Run Installcheck Test
        run: |
          docker run --rm --user postgres \
            -v ${{ github.workspace }}/pgdata:/mnt/shared \
            pg_z:test /bin/bash -c "
              export PGDATA=/mnt/shared/db_cluster &&
              mkdir -p \$PGDATA && initdb -D \$PGDATA &&
              pg_ctl start -D \$PGDATA -w &&
              PGUSER=postgres make installcheck &&
              pg_ctl stop -D \$PGDATA -m fast
            "

      - name: Run Benchmark Test
        run: |
          docker run --rm --user postgres \
            -v ${{ github.workspace }}/pgdata:/mnt/shared \
            pg_z:test /bin/bash -c "
              export PGDATA=/mnt/shared/db_cluster &&
              pg_ctl start -D \$PGDATA -w &&
              make benchmark &&
              pg_ctl stop -D \$PGDATA -m fast
            "

      - name: Run Load Test
        run: |
          docker run --rm --user postgres \
            -v ${{ github.workspace }}/pgdata:/mnt/shared \
            pg_z:test /bin/bash -c "
              export PGDATA=/mnt/shared/db_cluster &&
              pg_ctl start -D \$PGDATA -w &&
              make load_test &&
              pg_ctl stop -D \$PGDATA -m fast
            "
