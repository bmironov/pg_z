name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          tags: pg_z:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Load Test Inside Container
        run: |
          docker run --rm --user postgres pg_z:test /bin/bash -c "
            # Set up cluster directory path
            export PGDATA=/var/lib/postgresql/data &&
            # Create directory and initialize structural database layout
            mkdir -p \$PGDATA && initdb -D \$PGDATA &&
            # Start PostgreSQL 18 server in the background using pg_ctl
            pg_ctl start -D \$PGDATA -w &&
            # Execute your built-in extension test suite
            make load_test
          "
