# syntax=docker/dockerfile:1
name: New Version Release

on:
  push:
    tags:
      - '^[0-9]+\.[0-9]+\.[0-9]+$'
  workflow_dispatch:
    inputs:
      custom_version:
        description: "Version Tag Override (eg, 1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ==============================================================================
  # CENTRALIZED CONFIGURATION & VERSION INITIALIZATION
  # ==============================================================================
  init:
    name: Initialize Pipeline Context
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-resolver.outputs.RESOLVED_VERSION }}
    steps:
      - name: Checkout Repository Tree for Tag Discovery
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.custom_version || github.ref }}
          fetch-depth: 0

      - name: Compute Target Extension Version
        id: version-resolver
        run: |
          VERSION=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.custom_version }}" ]; then
            VERSION="${{ github.event.inputs.custom_version }}"
          elif [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION=$(echo "${{ github.ref_name }}" | tr -d '\n')
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            if [ -z "$VERSION" ]; then
              echo "⚠️  Ref '$VERSION' is not a valid 3-number tag version. Falling back to 0.0.1"
              VERSION="0.0.1"
            fi
          fi

          echo "RESOLVED_VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Pipeline version initialized: v${VERSION}"

  # ==============================================================================
  # COMPILING STATICALLY LINKED PG_Z AS DEBIAN PACKAGES (.DEB)
  # ==============================================================================
  build-deb:
    if: true
    name: Compile Debian Package
    runs-on: ubuntu-latest
    needs: init
    strategy:
      fail-fast: false # Failure in one build won't stop others
      max-parallel: 3
      matrix:
        # Supported Debian and Ubuntu LTS versions
        os_version: [bookworm, trixie, noble, jammy, resolute]
        # Supported PostgreSQL versions
        pg_version: [16, 17, 18]
    steps:
      - name: Checkout Source Code Tree
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.init.outputs.version }}

      - name: Set up Docker Buildx Context Engine
        uses: docker/setup-buildx-action@v4

      - name: Execute Unified Compiler & Regression Test Harness
        run: |
          chmod +x ./build/build-common.sh
          chmod +x ./build/build-deb.sh
          ./build/build-deb.sh "${{ matrix.os_version }}" "${{ matrix.pg_version }}" "${{ needs.init.outputs.version }}"

      - name: Stash Compiled .DEB Packages as Intermediate Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: build/packages/*.deb
          retention-days: 1
          archive: false

  # ==============================================================================
  # COMPILING STATICALLY LINKED PG_Z AS REDHAT PACKAGES (.RPM)
  # ==============================================================================
  build-rpm:
    if: true
    name: Compile RPM Package
    runs-on: ubuntu-latest
    needs: init
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # Supported Rocky LTS versions
        os_version: [rocky8, rocky9, rocky10]
        # Supported PostgreSQL versions
        pg_version: [16, 17, 18]

    steps:
      - name: Checkout Source Code Tree
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.init.outputs.version }}

      - name: Set up Docker Buildx Context Engine
        uses: docker/setup-buildx-action@v4

      - name: Execute Unified RPM Compiler & Regression Test Harness
        run: |
          chmod +x ./build/build-common.sh
          chmod +x ./build/build-rpm.sh
          ./build/build-rpm.sh "${{ matrix.os_version }}" "${{ matrix.pg_version }}" "${{ needs.init.outputs.version }}"

      - name: Stash Compiled .RPM Packages as Intermediate Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: build/packages/*.rpm
          retention-days: 1
          archive: false

  # ==============================================================================
  # UNIFIED RELEASER & ARTIFACT SHIPPER
  # ==============================================================================
  publish-release:
    if: true
    name: Publish Production GitHub Release
    runs-on: ubuntu-latest
    needs: [init, build-deb, build-rpm]
    permissions:
      contents: write
    steps:
      - name: Checkout Repository Context
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.init.outputs.version }}

      - name: Create Local Artifact Staging Workspace
        run: mkdir -p dist-assets/

      - name: Retrieve Stashed Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-assets/
          merge-multiple: true

      - name: Verify Extracted Release Asset Matrix
        run: |
          echo "=== Extracting stashed zip archives ==="
          ls -la dist-assets/

      - name: Generate SHA-256 Checksums for All Artifacts
        run: |
          echo "=== Generating SHA-256 hashes ==="
          cd dist-assets/
          find . -maxdepth 1 -type f ! -name "checksums.txt" -print0 | xargs -0 -r sha256sum > checksums.txt
          if [ ! -s "checksums.txt" ]; then
            echo "❌ Error: No target packages found in staging workspace! Aborting release."
            exit 1
          fi
          echo "=== Centralized Checksums Manifest ==="
          cat checksums.txt

      - name: Deploy Production Release & Ship Verified Artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.init.outputs.version }}
          name: "v${{ needs.init.outputs.version }}"
          # Automatically analyze commits between previous and current tags
          # and generates list of changes
          generate_release_notes: true
          draft: false
          prerelease: false
          body: >
            ## pg_z Key Features:


            - **Statically Linked Dependencies**: All compression algorithms
            are statically linked inside every supplied package. This ensures
            the usage of the latest compression library versions without
            interfering with system-level dependencies.


            - **Verified Stability**: Every published package has successfully
            passed comprehensive end-to-end (E2E) regression testing during
            the build phase.


            - **Documentation**: For deployment guidelines and API usage,
            please refer to the
            [README.md](https://github.com/bmironov/pg_z/blob/master/README.md).

          files: dist-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Purge Temporary Intermediate Workflow Artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            artifact
          useGlob: true
