name: Build and Package pg_z Postgres Extension

on:
  push:
    tags:
      - '[0-9].*[0-9].*[0-9]'
  workflow_dispatch: # Allows manual pipeline triggering

env:
  ZLIB_NG_VERSION: "2.3.3"

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      git_tag: ${{ steps.vars.outputs.GIT_TAG }}
      pkg_version: ${{ steps.vars.outputs.PKG_VERSION }}
      deb_date: ${{ steps.vars.outputs.DEB_DATE }}
      rpm_date: ${{ steps.vars.outputs.RPM_DATE }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Calculate Global Variables
        id: vars
        run: |
          GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.1")
          PKG_VERSION=$(echo $GIT_TAG)
          
          echo "GIT_TAG=${GIT_TAG}" >> $GITHUB_OUTPUT
          echo "PKG_VERSION=${PKG_VERSION}" >> $GITHUB_OUTPUT
          echo "DEB_DATE=$(date -R)" >> $GITHUB_OUTPUT
          echo "RPM_DATE=$(date +'%a %b %d %Y')" >> $GITHUB_OUTPUT

  # ==============================================================================
  # Building .DEB package (Ubuntu / Debian) and Postgres 16 - 18
  # ==============================================================================
  build-deb:
    if: false
    needs: init
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false # Failure in one build doesn't fail others
      matrix:
        debian_version: ["bookworm", "trixie"] # Debian 12 (bookworm), 13 (trixie)
        pg_version: ["16", "17", "18"]         # PostgreSQL versions

    container: debian:${{ matrix.debian_version }}
    env:
      GIT_TAG: ${{ needs.init.outputs.git_tag }}
      PKG_VERSION: ${{ needs.init.outputs.pkg_version }}
      DEB_DATE: ${{ needs.init.outputs.deb_date }}
      MATRIX_DEBIAN: ${{ matrix.debian_version }}
      MATRIX_PG: ${{ matrix.pg_version }}

    steps:
      - name: Install Core Version Control Tools
        run: |
          apt-get update
          apt-get install -y git wget curl ca-certificates gnupg2

      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 

      - name: Install Official PGDG Repository and PostgreSQL Header Toolchains
        run: |
          apt install -y postgresql-common
          echo | /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          # Refresh package indexing matrices using the newly registered secure channel mirrors
          apt-get update
          apt-get install -y --reinstall libc6-dev
          # Install debian package compiler targets alongside PostgreSQL ${MATRIX_PG} backend server development tools
          apt-get install -y git devscripts debhelper postgresql-server-dev-${MATRIX_PG} \
            libbrotli-dev zlib1g-dev liblz4-dev libsnappy-dev libzstd-dev cmake build-essential autoconf automake

      - name: Compile Static zlib-ng for DEB Build
        run: |
          cd /tmp
          wget "https://github.com/zlib-ng/zlib-ng/archive/refs/tags/${ZLIB_NG_VERSION}.tar.gz"
          tar -xzf "${ZLIB_NG_VERSION}.tar.gz" && cd "zlib-ng-${ZLIB_NG_VERSION}"
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_INSTALL_PREFIX=/opt/zlib-ng
          cmake --build . --parallel $(nproc)
          cmake --install .

          echo "DEB_CFLAGS=-I/opt/zlib-ng/include" >> $GITHUB_ENV
          echo "DEB_LDFLAGS=-L/opt/zlib-ng/lib64 -L/opt/zlib-ng/lib" >> $GITHUB_ENV

      - name: Prepare Dynamic Configuration Flags
        run: |
          EXTRA_FLAGS=""
          if [ "${MATRIX_DEBIAN}" = "bookworm" ]; then
            EXTRA_FLAGS="--with-link-zstd=dynamic --with-link-lz4=dynamic"
          fi
          echo "CONFIGURE_EXTRA_FLAGS=${EXTRA_FLAGS}" >> $GITHUB_ENV
          echo "DEB_CFLAGS=${DEB_CFLAGS} -I/usr/include" >> $GITHUB_ENV
          echo "DEB_LDFLAGS=${DEB_LDFLAGS} -L/usr/lib/x86_64-linux-gnu -L/usr/lib" >> $GITHUB_ENV
          
      - name: Build Debian Package
        env:
          GIT_TAG: ${{ needs.init.outputs.git_tag }}
          PKG_VERSION: ${{ needs.init.outputs.pkg_version }}
          DEB_DATE: ${{ needs.init.outputs.deb_date }}
        run: |
          if [ -n "$C_INCLUDE_PATH" ]; then export C_INCLUDE_PATH="$C_INCLUDE_PATH:/opt/zlib-ng/include"; else export C_INCLUDE_PATH="/opt/zlib-ng/include"; fi
          if [ -n "$CPATH" ]; then export CPATH="$CPATH:/opt/zlib-ng/include"; else export CPATH="/opt/zlib-ng/include"; fi
          if [ -n "$LIBRARY_PATH" ]; then export LIBRARY_PATH="$LIBRARY_PATH:/opt/zlib-ng/lib64:/opt/zlib-ng/lib"; else export LIBRARY_PATH="/opt/zlib-ng/lib64:/opt/zlib-ng/lib"; fi

          git config --global --add safe.directory '*'

          echo "Current code version based on Git tag: $(git describe --tags --abbrev=0 2>/dev/null || echo '0.0.1')"
          mkdir -p debian
          cat << EOF > debian/changelog
          pg-z (${PKG_VERSION}-1) ${MATRIX_DEBIAN}; urgency=low

            * Automated build from git tag ${GIT_TAG}.

           -- AI Packer <pack@example.com>  ${DEB_DATE}
          EOF

          cat << EOF > debian/control
          Source: pg-z
          Section: database
          Priority: optional
          Maintainer: AI Packer <pack@example.com>
          Build-Depends: debhelper-compat (= 13), postgresql-server-dev-${MATRIX_PG}, autoconf, automake
          Standards-Version: 4.6.0

          Package: postgresql-${MATRIX_PG}-pg-z
          Architecture: any
          Depends: \${shlibs:Depends}, \${misc:Depends}, postgresql-${MATRIX_PG}
          Description: Collection of userspace functions providing access to compression algorithms inside PostgreSQL ${MATRIX_PG}
          EOF

          cat << EOF_R > debian/rules
          #!/usr/bin/make -f
          export GIT_VERSION = ${PKG_VERSION}
          export DEB_CFLAGS_MAINT_APPEND = -I/opt/zlib-ng/include -I/usr/include
          export DEB_LDFLAGS_MAINT_APPEND = -L/opt/zlib-ng/lib64 -L/opt/zlib-ng/lib -L/usr/lib/x86_64-linux-gnu -L/usr/lib

          %:
          	dh \$@
          override_dh_auto_configure:
          	autoreconf -ifv --install
            ./configure --prefix=/usr ${{ env.CONFIGURE_EXTRA_FLAGS }} \
          	  CFLAGS="${{ env.DEB_CFLAGS }} -lpthread" \
          	  LDFLAGS="${{ env.DEB_LDFLAGS }} -lpthread" \
          	  LIBS="-lpthread -lm"

          override_dh_auto_build:
          	make

          override_dh_auto_install:
          	make install DESTDIR=\$(CURDIR)/debian/postgresql-${MATRIX_PG}-pg-z
          EOF_R
          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b

          # pickup generated files and copy them one level deeper for the "upload-artifacts" step
          DEB_ARCH=$(dpkg --print-architecture)
          mv ../postgresql-${MATRIX_PG}-pg-z_${PKG_VERSION}-1_${DEB_ARCH}.deb ../postgresql-${MATRIX_PG}-pg-z_${PKG_VERSION}-1.${MATRIX_DEBIAN}_${DEB_ARCH}.deb
          mv ../*.deb ./

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pg${{ matrix.pg_version }}-pg-z-${{ matrix.debian_version }}-${{ runner.arch }}-deb
          path: "*.deb"

  # ==============================================================================
  # Building .RPM package (Rocky Linux 8 - 9) and Postgres 16 - 18
  # ==============================================================================
  build-rpm:
    needs: init
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        rocky_version: ["8", "9"]       # Supports Rocky Linux 8 - 9
        pg_version: ["18"]  # Target PostgreSQL major versions

    container: rockylinux:${{ matrix.rocky_version }}
    env:
      GIT_TAG: ${{ needs.init.outputs.git_tag }}
      PKG_VERSION: ${{ needs.init.outputs.pkg_version }}
      RPM_DATE: ${{ needs.init.outputs.rpm_date }}
      MATRIX_ROCKY: ${{ matrix.rocky_version }}
      MATRIX_PG: ${{ matrix.pg_version }}

    steps:
      - name: Install Git and Basics in Container
        run: dnf install -y git wget shadow-utils

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PGDG Repository and Toolchain
        run: |
          dnf install -y epel-release

          # Enable CRB / PowerTools repositories (required for build headers)
          dnf config-manager --set-enabled crb || dnf config-manager --set-enabled powertools || true
          
          # CRITICAL FIX FOR ROCKY 8: Enable the 'devel' repository where perl-IPC-Run lives
          dnf config-manager --set-enabled devel || true

          dnf install -y https://download.postgresql.org/pub/repos/yum/reporpms/EL-${MATRIX_ROCKY}-x86_64/pgdg-redhat-repo-latest.noarch.rpm
          dnf install -y postgresql${MATRIX_PG}-devel
          
          # Disable OS-native appstream postgresql modules to prevent conflict packages
          dnf -qy module disable postgresql || true
          
          # Install toolchain and extension development headers alongside glibc-static for autoconf tests
          dnf install -y --nogpgcheck postgresql${MATRIX_PG}-devel gcc gcc-c++ make autoconf automake cmake \
            brotli-devel lz4-devel snappy-devel libzstd-devel zlib-devel rpm-build rpmdevtools glibc-static

      - name: Compile Static zlib-ng for RPM Build
        run: |
          cd /tmp
          wget "https://github.com/zlib-ng/zlib-ng/archive/refs/tags/${ZLIB_NG_VERSION}.tar.gz"
          tar -xzf "${ZLIB_NG_VERSION}.tar.gz" && cd "zlib-ng-${ZLIB_NG_VERSION}"
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_INSTALL_PREFIX=/opt/zlib-ng
          cmake --build . --parallel $(nproc)
          cmake --install .

          echo "RPM_CFLAGS=-I/opt/zlib-ng/include" >> $GITHUB_ENV
          echo "RPM_LDFLAGS=-L/opt/zlib-ng/lib64 -L/opt/zlib-ng/lib" >> $GITHUB_ENV

      - name: Prepare Dynamic Configuration Flags for RPM
        run: |
          # Grant workspace visibility access permissions under root container environment
          git config --global --add safe.directory '*'

          echo "RPM_PG_CONFIG=/usr/pgsql-${MATRIX_PG}/bin/pg_config" >> $GITHUB_ENV
          echo "PATH=/usr/pgsql-${MATRIX_PG}/bin:$PATH" >> $GITHUB_ENV
          
          LIBS_LINKING="--with-link-brotli=dynamic --with-link-lz4=dynamic"
          LIBS_LINKING="$LIBS_LINKING --with-link-zstd=dynamic --with-link-snappy=dynamic"
          echo "CONFIGURE_EXTRA_FLAGS=$LIBS_LINKING" >> $GITHUB_ENV

          echo "RPM_CFLAGS=${RPM_CFLAGS} -I/usr/include" >> $GITHUB_ENV
          echo "RPM_LDFLAGS=${RPM_LDFLAGS} -L/usr/lib64 -L/usr/lib" >> $GITHUB_ENV

      - name: Build RPM Package
        run: |
          VERSION_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "${PKG_VERSION}")
          echo "Real Git Version identified as: ${VERSION_TAG}"
          
          # Set up standard RPM builder tree directories path structure
          rpmdev-setuptree
          TAR_DIR="/tmp/pg_z-${PKG_VERSION}"
          mkdir -p $TAR_DIR
          cp -r ./* $TAR_DIR/
          echo "${VERSION_TAG}" > $TAR_DIR/VERSION

          # Physically inject official system Autotools scripts into the tarball folder.
          # This bypasses Automake constraints and ensures absolute isolation compliance.
          cp /usr/share/automake-*/install-sh $TAR_DIR/ 2>/dev/null || true
          cp /usr/share/automake-*/config.sub $TAR_DIR/ 2>/dev/null || true
          cp /usr/share/automake-*/config.guess $TAR_DIR/ 2>/dev/null || true
          chmod +x $TAR_DIR/install-sh $TAR_DIR/config.sub $TAR_DIR/config.guess 2>/dev/null || true
          
          cd /tmp && tar -czf ~/rpmbuild/SOURCES/pg_z-${PKG_VERSION}.tar.gz pg_z-${PKG_VERSION} && cd -

          # Generate valid .spec deployment manifest descriptor file context properties
          cat << EOF > pg_z.spec
          %define pg_config_path ${{ env.RPM_PG_CONFIG }}
          
          Name:           postgresql${MATRIX_PG}-pg_z
          Version:        ${PKG_VERSION}
          Release:        1.el${MATRIX_ROCKY}%{?dist}
          Summary:        Modern compression algorithms for PostgreSQL ${MATRIX_PG}
          License:        MIT
          URL:            https://github.com
          Source0:        pg_z-${PKG_VERSION}.tar.gz
          BuildRequires:  gcc make autoconf automake postgresql${MATRIX_PG}-devel glibc-static
          Requires:       postgresql${MATRIX_PG}-server
          
          %description
          Collection of userspace functions providing access to compression algorithms inside PostgreSQL ${MATRIX_PG}
          
          %prep
          %setup -q -n pg_z-${PKG_VERSION}
          
          %build
          autoconf
          
          ./configure ${{ env.CONFIGURE_EXTRA_FLAGS }} \
            CFLAGS="${{ env.RPM_CFLAGS }} -pthread" \
            LDFLAGS="${{ env.RPM_LDFLAGS }} -pthread" \
            LIBS="-lpthread -lm"
          make PG_CONFIG=%{pg_config_path}
          
          %install
          rm -rf %{buildroot}
          make install DESTDIR=%{buildroot} PG_CONFIG=%{pg_config_path}
          
          %files
          /usr/pgsql-${MATRIX_PG}/lib/pg_z.so
          /usr/pgsql-${MATRIX_PG}/share/extension/pg_z.control
          /usr/pgsql-${MATRIX_PG}/share/extension/pg_z--*.sql
          /usr/pgsql-${MATRIX_PG}/lib/bitcode/pg_z*
          
          %changelog
          * ${RPM_DATE} AI Packer <pack@example.com> - ${PKG_VERSION}-1
          - Automated build from git tag ${VERSION_TAG}.
          EOF

          # Run actual compilation task
          rpmbuild -ba pg_z.spec
          
          # Move output packages to localized subfolder path to prepare workspace targeting routing
          mkdir -p rpm-packages
          cp /root/rpmbuild/RPMS/x86_64/*.rpm ./rpm-packages/

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pg${{ matrix.pg_version }}-pg-z-rocky${{ matrix.rocky_version }}-${{ runner.arch }}-rpm
          path: "rpm-packages/*.rpm"

  # ==============================================================================
  # PUBLISH TO GITHUB RELEASES
  # ==============================================================================
  create-release:
    if: false
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Dynamically evaluate tag value depending on checkout context routes
      - name: Determine Target Release Tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.1")
            echo "TARGET_TAG=$LATEST_TAG" >> $GITHUB_OUTPUT
            echo "Manual trigger identified. Selected target release tag pointer: $LATEST_TAG"
          else
            # Use the active trigger tag directly
            echo "TARGET_TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "Tag push trigger identified. Processing target release tag pointer: ${{ github.ref_name }}"
          fi

      - name: Download DEB Artifact
        uses: actions/download-artifact@v4
        with:
          name: pg*-pg-z-*-deb
          path: ./artifacts

      - name: Download RPM Artifact
        uses: actions/download-artifact@v4
        with:
          name: pg*-pg-z-*-rpm
          path: ./artifacts

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TARGET_TAG }}
          name: Release ${{ steps.get_tag.outputs.TARGET_TAG }}
          body: |
            Automated extension release for PostgreSQL (Matrix Build).
            
            ### Supported Architectures:
            * Debian 12 (Bookworm) - PG 16, 17, 18
            * Debian 13 (Trixie) - PG 16, 17, 18
          draft: false
          prerelease: false
          files:
            ./artifacts/*.deb
            ./artifacts/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
