name: Build and Package pg_z Postgres Extension

on:
  push:
    tags:
      - '[0-9].*[0-9].*[0-9]'
  workflow_dispatch: # Allows manual pipeline triggering

env:
  ZLIB_NG_VERSION: "2.3.3"

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      git_tag: ${{ steps:vars.outputs.GIT_TAG }}
      pkg_version: ${{ steps:vars.outputs.PKG_VERSION }}
      deb_date: ${{ steps:vars.outputs.DEB_DATE }}
      rpm_date: ${{ steps:vars.outputs.RPM_DATE }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Calculate Variables
        id: vars
        run: |
          GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.1")
          PKG_VERSION=$$(echo $GIT_TAG)
          
          echo "GIT_TAG=${GIT_TAG}" >> $GITHUB_OUTPUT
          echo "PKG_VERSION=${PKG_VERSION}" >> $GITHUB_OUTPUT
          echo "DEB_DATE=$(date -R)" >> $GITHUB_OUTPUT
          echo "RPM_DATE=$(date +'%a %b %d %Y')" >> $GITHUB_OUTPUT

  # ==============================================================================
  # Building .DEB package (Ubuntu / Debian)
  # ==============================================================================
  build-deb:
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      GIT_TAG: ${{ needs.init.outputs.git_tag }}
      PKG_VERSION: ${{ needs.init.outputs.pkg_version }}
      DEB_DATE: ${{ needs.init.outputs.deb_date }}
    steps:
      - name: Install Core Version Control Tools
        run: |
          apt-get update
          apt-get install -y git wget curl ca-certificates gnupg2

      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Install Official PGDG Repository and PostgreSQL 18 Header Toolchains
        run: |
          apt install -y postgresql-common
          echo | /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          # Refresh package indexing matrices using the newly registered secure channel mirrors
          apt-get update
          # Install debian package compiler targets alongside PostgreSQL 18 backend server development tools
          apt-get install -y git devscripts debhelper postgresql-server-dev-18 \
            libbrotli-dev liblz4-dev libsnappy-dev libzstd-dev cmake build-essential autoconf automake

      - name: Compile Static zlib-ng for DEB Build
        run: |
          cd /tmp
          wget "https://github.com/zlib-ng/zlib-ng/archive/refs/tags/${ZLIB_NG_VERSION}.tar.gz"
          tar -xzf "${ZLIB_NG_VERSION}.tar.gz" && cd "zlib-ng-${ZLIB_NG_VERSION}"
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_INSTALL_PREFIX=/opt/zlib-ng
          cmake --build . --parallel $(nproc)
          cmake --install .

      - name: Build Debian Package
        env:
          C_INCLUDE_PATH: /opt/zlib-ng/include
          CPATH: /opt/zlib-ng/include
          LIBRARY_PATH: /opt/zlib-ng/lib64:/opt/zlib-ng/lib
        run: |
          mkdir -p debian
          cat << EOF > debian/changelog
          pg_z (${PKG_VERSION}) trixiel; urgency=low

            * Automated build from git tag ${GIT_TAG}.

           -- AI Packer <pack@example.com>  ${DEB_DATE}
          EOF

          cat << 'EOF' > debian/control
          Source: pg-z
          Section: database
          Priority: optional
          Maintainer: AI Packer <pack@example.com>
          Build-Depends: debhelper-compat (= 13), postgresql-server-dev-18, autoconf, automake
          Standards-Version: 4.6.0

          Package: postgresql-18-pg-z
          Architecture: any
          Depends: ${shlibs:Depends}, ${misc:Depends}, postgresql-18
          Description: Modern compression algorithms for PostgreSQL 18
          EOF

          cat << 'EOF' > debian/rules
          #!/usr/bin/make -f
          %:
          	dh $@
          override_dh_auto_configure:
          	autoreconf -if
          	./configure
          override_dh_auto_install:
          	make install DESTDIR=$(CURDIR)/debian/postgresql-18-pg-z
          EOF
          chmod +x debian/rules
          echo "13" > debian/compat
          dpkg-buildpackage -us -uc -b

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-18-pg-z-deb
          path: ../*.deb

  # ==============================================================================
  # Building .RPM package (Rocky Linux / RHEL 9)
  # ==============================================================================
  build-rpm:
    runs-on: ubuntu-latest
    container: rockylinux:9
    env:
      GIT_TAG: ${{ needs.init.outputs.git_tag }}
      PKG_VERSION: ${{ needs.init.outputs.pkg_version }}
      RPM_DATE: ${{ needs.init.outputs.rpm_date }}
    steps:
      - name: Install Git and Basics in Container
        run: dnf install -y git wget shadow-utils

      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Install PGDG Repository and Toolchain
        run: |
          dnf install -y epel-release
          dnf config-manager --set-enabled crb

          # Install the exact PGDG YUM repository RPM package for EL9 architectures
          dnf install -y https://download.postgresql.org/pub/repos/yum/common/redhat/rhel-9-x86_64/pgdg-redhat-repo-42.0-66.rhel9.8PGDG.noarch.rpm

          # Disable default built-in appstream postgresql modules to let PGDG packages take priority
          dnf -qy module disable postgresql

          # Install toolchain and extension development headers (now perl-IPC-Run will resolve perfectly)
          dnf install -y --nogpgcheck postgresql18-devel gcc make autoconf automake cmake \
            brotli-devel lz4-devel snappy-devel libzstd-devel zlib-devel rpm-build rpmdevtools

      - name: Compile Static zlib-ng for RPM Build
        run: |
          cd /tmp
          wget "https://github.com/zlib-ng/zlib-ng/archive/refs/tags/{{ env.ZLIB_NG_VERSION }}.tar.gz"
          tar -xzf "${{ env.ZLIB_NG_VERSION }}.tar.gz" && cd "zlib-ng-${{ env.ZLIB_NG_VERSION }}"
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_INSTALL_PREFIX=/opt/zlib-ng
          cmake --build . --parallel $(nproc)
          cmake --install .

      - name: Build RPM Package
        env:
          C_INCLUDE_PATH: /opt/zlib-ng/include
          CPATH: /opt/zlib-ng/include
          LIBRARY_PATH: /opt/zlib-ng/lib64:/opt/zlib-ng/lib
        run: |
          rpmdev-setuptree
          TAR_DIR="/tmp/pg_z-1.0"
          mkdir -p $TAR_DIR
          cp -r ./* $TAR_DIR/
          cd /tmp && tar -czf ~/rpmbuild/SOURCES/pg_z-1.0.tar.gz pg_z-1.0 && cd -

          cat << 'EOF' > pg_z.spec
          Name:           postgresql18-pg_z
          Version:        1.0
          Release:        1%{?dist}
          Summary:        Modern compression algorithms for PostgreSQL 18
          License:        MIT
          URL:            https://github.com
          Source0:        pg_z-1.0.tar.gz
          BuildRequires:  gcc make autoconf automake postgresql18-devel
          Requires:       postgresql18-server
          %description
          Modern compression algorithms for PostgreSQL 18 (Brotli, LZ4, Snappy, Zstd, static zlib-ng)
          %prep
          %setup -q -n pg_z-1.0
          %build
          autoreconf -if
          ./configure PG_CONFIG=/usr/pgsql-18/bin/pg_config --with-link-gzip-ng=static
          make %{?_smp_mflags}
          %install
          rm -rf %{buildroot}
          make install DESTDIR=%{buildroot}
          %files
          /usr/pgsql-18/lib/pg_z.so
          /usr/pgsql-18/share/extension/pg_z.control
          /usr/pgsql-18/share/extension/pg_z--*.sql
          /usr/pgsql-18/lib/bitcode/pg_z*
          EOF

          rpmbuild -ba pg_z.spec

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-18-pg-z-rpm
          path: /root/rpmbuild/RPMS/x86_64/*.rpm

  # ==============================================================================
  # PUBLISH TO GITHUB RELEASES
  # ==============================================================================
  create-release:
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Dynamically evaluate tag value depending on checkout context routes
      - name: Determine Target Release Tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.1")
            echo "TARGET_TAG=$LATEST_TAG" >> $GITHUB_OUTPUT
            echo "Manual trigger identified. Selected target release tag pointer: $LATEST_TAG"
          else
            # Use the active trigger tag directly
            echo "TARGET_TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "Tag push trigger identified. Processing target release tag pointer: ${{ github.ref_name }}"
          fi

      - name: Download DEB Artifact
        uses: actions/download-artifact@v4
        with:
          name: postgresql-18-pg-z-deb
          path: ./artifacts

      - name: Download RPM Artifact
        uses: actions/download-artifact@v4
        with:
          name: postgresql-18-pg-z-rpm
          path: ./artifacts

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TARGET_TAG }}
          files: |
            ./artifacts/*.deb
            ./artifacts/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

